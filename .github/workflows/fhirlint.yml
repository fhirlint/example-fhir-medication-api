name: FHIR Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

jobs:
  validate-fixtures:
    name: Validate FHIR fixtures (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show fhirlint version
        run: docker run --rm ghcr.io/fhirlint/fhirlint:latest version

      - name: Validate FHIR fixtures
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests/fixtures:/work \
            ghcr.io/fhirlint/fhirlint:latest \
            validate /work --fail-on error --severity warning --no-terminology-server

  reports:
    name: JUnit & SARIF reports
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install fhirlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo fhirlint/fhirlint --pattern "*linux_amd64.tar.gz"
          tar xzf fhirlint_*_linux_amd64.tar.gz
          sudo mv fhirlint /usr/local/bin/
          rm fhirlint_*_linux_amd64.tar.gz

      - name: Validate fixtures (terminal + JUnit + SARIF)
        run: |
          fhirlint validate tests/fixtures/ \
            --ig kbv.basis#1.5.0 \
            --format terminal \
            --format junit \
            --format sarif \
            --output fhir-results \
            --no-terminology-server

      - name: Publish JUnit results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: "**/fhir-results.xml"
          include_passed: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: fhir-results.sarif
          category: fhir-validation

  validate-live:
    name: Validate live API responses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install fhirlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo fhirlint/fhirlint --pattern "*linux_amd64.tar.gz"
          tar xzf fhirlint_*_linux_amd64.tar.gz
          sudo mv fhirlint /usr/local/bin/
          rm fhirlint_*_linux_amd64.tar.gz

      - name: Start Symfony server
        run: php -S localhost:8000 -t public/ &

      - name: Validate live API responses
        run: |
          mkdir -p /tmp/fhir-responses
          curl -sf http://localhost:8000/fhir/Medication/ibuprofen-400      -o /tmp/fhir-responses/medication-ibuprofen-400.json
          curl -sf http://localhost:8000/fhir/Medication/metformin-500      -o /tmp/fhir-responses/medication-metformin-500.json
          curl -sf http://localhost:8000/fhir/MedicationRequest/request-001 -o /tmp/fhir-responses/medication-request-001.json
          curl -sf http://localhost:8000/fhir/MedicationRequest/request-002 -o /tmp/fhir-responses/medication-request-002.json
          curl -sf http://localhost:8000/fhir/Patient/patient-001                   -o /tmp/fhir-responses/patient-001.json
          curl -sf http://localhost:8000/fhir/Patient/patient-002                   -o /tmp/fhir-responses/patient-002.json
          curl -sf http://localhost:8000/fhir/Medication/ibuprofen-400-de           -o /tmp/fhir-responses/medication-ibuprofen-400-de.json
          curl -sf http://localhost:8000/fhir/MedicationRequest/request-de-001      -o /tmp/fhir-responses/medication-request-de-001.json
          fhirlint validate /tmp/fhir-responses/ --fail-on error --severity warning --no-terminology-server
          fhirlint version

      - name: Validate German resources against KBV profiles
        run: |
          fhirlint validate \
            tests/fixtures/medication-ibuprofen-400-de.json \
            --ig kbv.basis#1.5.0 \
            --fail-on error \
            --severity warning \
            --no-terminology-server
