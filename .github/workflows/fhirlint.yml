name: FHIR Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: fhirlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install fhirlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo fhirlint/fhirlint --pattern "*linux_amd64.tar.gz"
          tar xzf fhirlint_*_linux_amd64.tar.gz
          sudo mv fhirlint /usr/local/bin/
          rm fhirlint_*_linux_amd64.tar.gz

      - name: Validate FHIR fixtures
        run: fhirlint validate tests/fixtures/ --fail-on error --severity warning
